# Stage 11 evaluation dataset (docs/HANDOVER.md 11.A).
#
# Realistic support questions over the synthetic Meridian knowledge base, each
# with the answer the system SHOULD give. Loaded and validated by
# app/eval/dataset.py; used by pytest and by `python -m app.eval`.
#
# Fields per case:
#   id             category prefix + number, unique
#   category       knowledge | paraphrase | tool | hybrid | failure | off_topic | injection
#   question       the question as a support engineer would type it
#   expected_path  the agent's DecisionReason (app/agent/models.py)
#   expected_docs  document ids (data/knowledge/**/<id>.md); a hit is ANY of them
#   expected_tools MCP tool names that must be called
#   must_mention   short facts the evidence (free mode) or answer (--paid) must contain
#
# Expectations are written from the documentation and the Stage 7 routing rules,
# NOT fitted to what the system currently does. A case the system gets wrong is
# a finding to report, not an expectation to edit.

version: "1.0"

# Soft floors (11.C): set a little under the scores measured when Stage 11 was
# built (2026-09-15, all-MiniLM-L6-v2, mock provider, k=5):
#   recall@5 1.000 · MRR 0.927 · path accuracy 0.959 (47/49)
# Re-measure with `python -m app.eval` before changing them.
thresholds:
  recall_at_k: 0.90
  mrr: 0.85
  path_accuracy: 0.90

cases:
  # --- knowledge: answered from the documentation ---------------------------
